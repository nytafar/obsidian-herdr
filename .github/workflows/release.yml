name: Release Obsidian plugin

# Tag a release with the bare manifest version, e.g. `0.1.0` (no `v` prefix):
# this is Obsidian's own contract (AGENTS.md, the official sample plugin).
# BRAT and the community plugin list both read `manifest.json` from the release,
# so the three shipped files are attached as plain assets (PRD N5).
on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Check the tag matches manifest.json
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "tag $tag does not match manifest version $version" >&2
                    exit 1
                  fi
                  # versions.json must map this version to a minAppVersion, or
                  # Obsidian cannot decide whether the release is installable.
                  node -e "
                    const versions = require('./versions.json');
                    const manifest = require('./manifest.json');
                    if (versions[manifest.version] !== manifest.minAppVersion) {
                      console.error('versions.json is missing or disagrees for ' + manifest.version);
                      process.exit(1);
                    }
                  "

            - name: Check the bundle ships only the three files
              run: |
                  test -f main.js
                  test -f manifest.json
                  test -f styles.css
                  # PRD N5: ghostty-vt.wasm must be embedded in main.js, not
                  # emitted next to it. Since issue #63 it is embedded Brotli-
                  # compressed, decoded once at runtime, so the marker to look
                  # for is the decode shim's, not a data URL's.
                  marker="$(grep -c 'herdr:wasm-brotli' main.js || true)"
                  if [ "$marker" != "1" ]; then
                    echo "expected 1 brotli wasm decode shim in main.js, found $marker" >&2
                    exit 1
                  fi
                  # And the uncompressed base64 must be gone: 'AGFzbQEAAAA' is
                  # base64 of the wasm magic number, so finding it means the
                  # transform did not run and main.js is ~430 KB heavier.
                  if grep -q 'AGFzbQEAAAA' main.js; then
                    echo "main.js still carries the wasm as plain base64" >&2
                    exit 1
                  fi
                  # And the build must emit nothing else: main.js is the only
                  # file the working tree gains (node_modules aside).
                  strays="$(git status --porcelain --ignored=matching --untracked-files=all -- . ':!node_modules' \
                    | awk '{print $2}' \
                    | grep -v -x -e 'main.js' -e 'node_modules/' || true)"
                  if [ -n "$strays" ]; then
                    echo "the build emitted unexpected files: $strays" >&2
                    exit 1
                  fi

            - name: Create the GitHub release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" \
                    --title "$tag" \
                    --generate-notes \
                    main.js manifest.json styles.css
